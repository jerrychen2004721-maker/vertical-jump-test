<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>垂直跳動作分析系統 (三關節追蹤 + 雙引擎影片匯入)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212; color: #ffffff; margin: 0; padding-bottom: 30px;
      display: flex; flex-direction: column; align-items: center;
    }
    h2 { margin-top: 20px; margin-bottom: 5px; }
    
    .container {
      position: relative; width: 640px; height: 480px; margin-top: 10px;
      border: 2px solid #333; border-radius: 8px; overflow: hidden; background-color: #000;
    }
    
    /* 關鍵修正：不能使用 display: none，否則 iOS 會拒絕處理影片畫面 */
    .hidden-video {
      position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;
    }
    
    canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      transform: scaleX(-1);
    }
    
    #countdown_overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 150px; font-weight: bold; color: white; text-shadow: 0px 0px 20px #ff3d00;
      display: none; z-index: 10;
    }

    .panel {
      width: 640px; background: #1e1e1e; padding: 15px; margin-top: 15px;
      border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;
    }
    
    .phase-panel {
      width: 640px; background: #2a2a2a; padding: 10px 15px; margin-top: 10px;
      border-radius: 8px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; font-size: 16px; gap: 5px;
    }
    .phase-active { color: #ff9100; font-weight: bold; font-size: 18px; }

    .history-panel { flex-direction: column; align-items: flex-start; }
    .history-panel h3 { margin: 0 0 10px 0; color: #00b0ff; }
    
    #history_list { list-style: none; padding: 0; margin: 0; width: 100%; max-height: 250px; overflow-y: auto;}
    #history_list li {
      background: #2a2a2a; margin-bottom: 8px; padding: 12px; border-radius: 5px;
      display: flex; flex-direction: column; border-left: 4px solid #00e676;
    }
    .record-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; margin-bottom: 5px; }
    .record-details { font-size: 14px; color: #aaa; line-height: 1.5;}
    
    .data-box { text-align: center; }
    .data-value { font-size: 24px; font-weight: bold; color: #00e676; }
    .history-value { color: #00e676; font-weight: bold; }
    
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 320px;}
    button {
      background-color: #2979ff; color: white; border: none;
      padding: 10px 15px; font-size: 15px; border-radius: 5px;
      cursor: pointer; transition: 0.2s; font-weight: bold;
    }
    button:disabled { background-color: #555; cursor: not-allowed; }
    
    .btn-ready { background-color: #ff3d00; }
    .btn-ready:hover { background-color: #dd3600; }
    .btn-upload { background-color: #9c27b0; }
    .btn-upload:hover { background-color: #7b1fa2; }
    .btn-cam { background-color: #009688; display: none; }
    .btn-cam:hover { background-color: #00796b; }
    
    .btn-line {
      background-color: #06C755; color: white; padding: 6px 12px; font-size: 14px; border-radius: 4px;
      text-decoration: none; display: inline-block; font-weight: bold; margin-top: 8px; align-self: flex-start;
    }
  </style>
</head>
<body>

  <h2>垂直跳動作分析與測量系統</h2>
  
  <div class="container">
    <video id="webcam_video" class="hidden-video" playsinline autoplay></video>
    <video id="upload_video" class="hidden-video" playsinline muted></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
    <div id="countdown_overlay">3</div>
  </div>

  <div class="phase-panel">
    <div>即時角度 ➔ 髖: <span id="hip_angle" style="color:#00b0ff;">180°</span> | 膝: <span id="knee_angle" style="color:#00b0ff;">180°</span> | 踝: <span id="ankle_angle" style="color:#00b0ff;">90°</span></div>
    <div>動作階段 ➔ <span id="action_phase" class="phase-active">啟動中...</span></div>
  </div>

  <div class="panel">
    <div class="data-box">本次滯空<br><span id="flight_time" class="data-value">0.000</span> 秒</div>
    <div class="data-box">預估高度<br><span id="jump_height" class="data-value">0.0</span> cm</div>
    <div class="btn-group">
      <input type="file" id="file_input" accept="video/*" style="display: none;">
      <button id="cam_btn" class="btn-cam">返回鏡頭</button>
      <button id="upload_btn" class="btn-upload">匯入影片</button>
      <button id="start_btn" class="btn-ready">開始測量</button>
    </div>
  </div>

  <div class="panel history-panel">
    <h3>詳細測量紀錄</h3>
    <ul id="history_list"></ul>
  </div>

  <script>
    const webcamVideo = document.getElementById('webcam_video');
    const uploadVideo = document.getElementById('upload_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const startBtn = document.getElementById('start_btn');
    const uploadBtn = document.getElementById('upload_btn');
    const camBtn = document.getElementById('cam_btn');
    const fileInput = document.getElementById('file_input');
    const countdownOverlay = document.getElementById('countdown_overlay');
    
    const hipAngleText = document.getElementById('hip_angle');
    const kneeAngleText = document.getElementById('knee_angle');
    const ankleAngleText = document.getElementById('ankle_angle');
    const actionPhaseText = document.getElementById('action_phase');
    const historyList = document.getElementById('history_list');
    
    let isLiveMode = true; 
    let liveCamera = null;
    let currentState = 'IDLE'; 
    let groundBaselineY = null;
    let takeoffTimestamp = 0;
    let jumpCount = 0;
    const GRAVITY = 9.81;

    let jumpPhase = '站立'; 
    let minKneeAngle = 180;
    let maxHipAngle = 0;
    let maxKneeAngle = 0;
    let maxAnkleAngle = 0;
    let jumpThreshold = 0.03;

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

    function calculateAngle(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      return angle > 180.0 ? 360.0 - angle : angle;
    }

    function drawBodyOnly(ctx, landmarks) {
      ctx.lineWidth = 3; ctx.strokeStyle = '#00FF00';
      for (const connection of POSE_CONNECTIONS) {
        if (connection[0] > 10 && connection[1] > 10) {
          const start = landmarks[connection[0]]; const end = landmarks[connection[1]];
          ctx.beginPath();
          ctx.moveTo(start.x * canvasElement.width, start.y * canvasElement.height);
          ctx.lineTo(end.x * canvasElement.width, end.y * canvasElement.height);
          ctx.stroke();
        }
      }
      ctx.fillStyle = '#FF0000';
      for (let i = 11; i < landmarks.length; i++) {
        const lm = landmarks[i];
        ctx.beginPath(); ctx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, 4, 0, 2 * Math.PI); ctx.fill();
      }
    }

    pose.onResults((results) => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      
      if (results.poseLandmarks) {
        drawBodyOnly(canvasCtx, results.poseLandmarks);
        const lms = results.poseLandmarks;
        const currentFootY = Math.max(lms[27].y, lms[28].y);
        
        // 角度計算
        const avgHipAngle = (calculateAngle(lms[11], lms[23], lms[25]) + calculateAngle(lms[12], lms[24], lms[26])) / 2;
        const avgKneeAngle = (calculateAngle(lms[23], lms[25], lms[27]) + calculateAngle(lms[24], lms[26], lms[28])) / 2;
        const avgAnkleAngle = (calculateAngle(lms[25], lms[27], lms[31]) + calculateAngle(lms[26], lms[28], lms[32])) / 2;
        
        hipAngleText.innerText = avgHipAngle.toFixed(0) + '°';
        kneeAngleText.innerText = avgKneeAngle.toFixed(0) + '°';
        ankleAngleText.innerText = avgAnkleAngle.toFixed(0) + '°';

        if (currentState === 'IDLE' || currentState === 'COUNTDOWN') { canvasCtx.restore(); return; }

        if (currentState === 'CALIBRATING') {
          groundBaselineY = currentFootY; currentState = 'GROUNDED'; jumpPhase = '站立';
        } 
        else if (currentState === 'GROUNDED' || currentState === 'AIRBORNE') {
          if (groundBaselineY) {
            canvasCtx.beginPath(); canvasCtx.moveTo(0, groundBaselineY * canvasElement.height);
            canvasCtx.lineTo(canvasElement.width, groundBaselineY * canvasElement.height);
            canvasCtx.strokeStyle = 'yellow'; canvasCtx.lineWidth = 2; canvasCtx.stroke();
          }

          const isAirborne = currentFootY < (groundBaselineY - jumpThreshold);

          // 紀錄三關節最大角度
          if (avgHipAngle > maxHipAngle) maxHipAngle = avgHipAngle;
          if (avgKneeAngle > maxKneeAngle) maxKneeAngle = avgKneeAngle;
          if (avgAnkleAngle > maxAnkleAngle) maxAnkleAngle = avgAnkleAngle;

          // 階段判定
          if (currentState === 'GROUNDED') {
             if (avgKneeAngle < minKneeAngle) minKneeAngle = avgKneeAngle;
             if (jumpPhase === '站立' && avgKneeAngle < 165) { jumpPhase = '制動 (Braking)'; actionPhaseText.innerText = jumpPhase; }
             else if (jumpPhase === '制動 (Braking)' && avgKneeAngle > minKneeAngle + 5) { jumpPhase = '推蹬 (Propulsion)'; actionPhaseText.innerText = jumpPhase; }
          }

          if (currentState === 'GROUNDED' && isAirborne) {
            currentState = 'AIRBORNE';
            takeoffTimestamp = isLiveMode ? (performance.now() / 1000) : uploadVideo.currentTime;
            jumpPhase = '滯空 (Flight)'; actionPhaseText.innerText = jumpPhase;
          } 
          else if (currentState === 'AIRBORNE' && !isAirborne) {
            const landingTimestamp = isLiveMode ? (performance.now() / 1000) : uploadVideo.currentTime;
            const flightTimeSec = Math.max(0, landingTimestamp - takeoffTimestamp);
            
            if (flightTimeSec > 0.15) {
              const heightCm = (1 / 8) * GRAVITY * Math.pow(flightTimeSec, 2) * 100;
              document.getElementById('flight_time').innerText = flightTimeSec.toFixed(3);
              document.getElementById('jump_height').innerText = heightCm.toFixed(1);
              
              const shareText = `【我的垂直跳測試數據】\n🚀 高度：${heightCm.toFixed(1)} cm\n⏱️ 滯空：${flightTimeSec.toFixed(3)} 秒\n💥 伸展度 ➔ 髖:${maxHipAngle.toFixed(0)}°/膝:${maxKneeAngle.toFixed(0)}°/踝:${maxAnkleAngle.toFixed(0)}°`;
              
              const li = document.createElement('li');
              li.innerHTML = `
                <div class="record-header"><span>第 ${++jumpCount} 跳</span> <span style="color:#00e676; font-weight:bold;">${heightCm.toFixed(1)} cm</span></div>
                <div class="record-details">滯空: ${flightTimeSec.toFixed(3)}s<br>最大伸展: 髖 <span class="history-value">${maxHipAngle.toFixed(0)}°</span> | 膝 <span class="history-value">${maxKneeAngle.toFixed(0)}°</span> | 踝 <span class="history-value">${maxAnkleAngle.toFixed(0)}°</span></div>
                <a href="https://line.me/R/msg/text/?${encodeURIComponent(shareText)}" target="_blank" class="btn-line">分享到 LINE</a>
              `;
              historyList.insertBefore(li, historyList.firstChild);
            }
            
            currentState = 'IDLE'; actionPhaseText.innerText = '測量完成';
            if (!isLiveMode) { uploadVideo.pause(); }
            startBtn.innerText = isLiveMode ? '開始下一次測量' : '重新分析影片';
            startBtn.disabled = false; startBtn.classList.add('btn-ready');
          }
        }
      }
      canvasCtx.restore();
    });

    // 鏡頭啟動邏輯
    function startWebcam() {
      isLiveMode = true; camBtn.style.display = 'none'; canvasElement.style.transform = 'scaleX(-1)';
      actionPhaseText.innerText = '待機 (即時鏡頭)'; startBtn.innerText = '開始測量'; startBtn.disabled = false;
      
      if (!liveCamera) {
        liveCamera = new Camera(webcamVideo, {
          onFrame: async () => { if(isLiveMode) await pose.send({image: webcamVideo}); },
          width: 640, height: 480, frameRate: { ideal: 60, max: 120 } 
        });
      }
      liveCamera.start();
    }
    
    startWebcam();

    camBtn.addEventListener('click', () => {
      uploadVideo.pause(); currentState = 'IDLE'; startWebcam();
    });

    // 影片匯入邏輯
    uploadBtn.addEventListener('click', () => { fileInput.click(); });
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;

      isLiveMode = false;
      if (liveCamera) liveCamera.stop(); 
      
      canvasElement.style.transform = 'scaleX(1)';
      camBtn.style.display = 'block'; 
      actionPhaseText.innerText = '處理影片中...'; startBtn.disabled = true;

      uploadVideo.src = URL.createObjectURL(file);
      uploadVideo.load();
    });

    uploadVideo.addEventListener('loadeddata', () => {
      uploadVideo.currentTime = 0;
      setTimeout(async () => {
        try {
          await pose.send({image: uploadVideo});
          currentState = 'IDLE';
          actionPhaseText.innerText = '影片已就緒 (起初請保持站立)';
          startBtn.innerText = '分析影片跳躍';
          startBtn.disabled = false;
        } catch(err) {
          console.error(err);
          actionPhaseText.innerText = '影片格式解析失敗';
        }
      }, 500); 
    });

    function processVideoFrame() {
      if (isLiveMode || uploadVideo.paused || uploadVideo.ended) return;
      pose.send({image: uploadVideo}).then(() => {
        requestAnimationFrame(processVideoFrame);
      }).catch(e => {
        requestAnimationFrame(processVideoFrame);
      });
    }
    uploadVideo.addEventListener('play', processVideoFrame);

    startBtn.addEventListener('click', () => {
      if (currentState !== 'IDLE') return;

      if (isLiveMode) {
        currentState = 'COUNTDOWN'; startBtn.disabled = true; startBtn.innerText = '準備中...'; startBtn.classList.remove('btn-ready');
        let count = 3; countdownOverlay.innerText = count; countdownOverlay.style.display = 'block';
        const timer = setInterval(() => {
          count--;
          if (count > 0) { countdownOverlay.innerText = count; } 
          else {
            clearInterval(timer); countdownOverlay.style.display = 'none';
            groundBaselineY = null; currentState = 'CALIBRATING'; startBtn.innerText = '偵測中...';
            jumpPhase = '站立'; minKneeAngle = 180; maxHipAngle = 0; maxKneeAngle = 0; maxAnkleAngle = 0; actionPhaseText.innerText = '站立準備';
          }
        }, 1000);
      } else {
        groundBaselineY = null; currentState = 'CALIBRATING';
        startBtn.disabled = true; startBtn.innerText = '分析中...'; startBtn.classList.remove('btn-ready');
        jumpPhase = '站立'; minKneeAngle = 180; maxHipAngle = 0; maxKneeAngle = 0; maxAnkleAngle = 0;
        uploadVideo.currentTime = 0; uploadVideo.play(); 
      }
    });
  </script>
</body>
</html>
