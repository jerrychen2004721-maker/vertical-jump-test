<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>垂直跳高度測量 (手動開始版)</title>
  <!-- 引入 MediaPipe 所需庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { margin-top: 20px; }
    .container {
      position: relative;
      width: 640px;
      height: 480px;
      margin-top: 10px;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    .panel {
      width: 640px;
      background: #1e1e1e;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }
    .data-box {
      text-align: center;
    }
    .data-value {
      font-size: 24px;
      font-weight: bold;
      color: #00e676;
    }
    button {
      background-color: #2979ff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background-color: #2264d1; }
    /* 開始按鈕在未點擊前給予醒目顏色 */
    .btn-ready { background-color: #ff3d00; font-weight: bold; }
    .btn-ready:hover { background-color: #dd3600; }
    
    .status {
      font-weight: bold;
      color: #ff9100;
    }
  </style>
</head>
<body>

  <h2>垂直跳高度即時測量系統</h2>
  
  <div class="container">
    <video id="input_video" width="640" height="480" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <div class="panel">
    <div>
      狀態: <span id="status_text" class="status">請站到畫面中，按下開始</span>
    </div>
    <div class="data-box">
      滯空時間<br>
      <span id="flight_time" class="data-value">0.000</span> 秒
    </div>
    <div class="data-box">
      預估跳躍高度<br>
      <span id="jump_height" class="data-value">0.0</span> cm
    </div>
    <!-- 將按鈕改為開始測量 -->
    <button id="start_btn" class="btn-ready">開始測量</button>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const statusText = document.getElementById('status_text');
    const flightTimeText = document.getElementById('flight_time');
    const jumpHeightText = document.getElementById('jump_height');
    const startBtn = document.getElementById('start_btn');

    let groundBaselineY = null;
    let jumpThreshold = 0.03;
    
    // 將初始狀態改為 IDLE (待機)，此時只顯示畫面不測量
    let currentState = 'IDLE'; 
    let takeoffTime = 0;
    const GRAVITY = 9.81;

    // 按下開始按鈕後，才進入校正與測量狀態
    startBtn.addEventListener('click', () => {
      groundBaselineY = null;
      currentState = 'CALIBRATING';
      
      // 更改按鈕外觀與文字 (變成重新校正的功能)
      startBtn.innerText = '重新校正';
      startBtn.classList.remove('btn-ready');
      
      statusText.innerText = '抓取地面基準線中...';
      statusText.style.color = '#ff9100';
    });

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      smoothSegmentation: false,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    pose.onResults((results) => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      
      if (results.poseLandmarks) {
        // 無論在哪個狀態，都保持繪製骨架讓使用者知道鏡頭有抓到人
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 1, radius: 2});

        const leftAnkleY = results.poseLandmarks[27].y;
        const rightAnkleY = results.poseLandmarks[28].y;
        const currentFootY = Math.max(leftAnkleY, rightAnkleY);

        // 如果還沒按下開始 (IDLE)，就提早結束這回合的邏輯，不進行跳躍判定
        if (currentState === 'IDLE') {
          canvasCtx.restore();
          return;
        }

        if (currentState === 'CALIBRATING') {
          groundBaselineY = currentFootY;
          currentState = 'GROUNDED';
          statusText.innerText = '偵測中，請起跳！';
          statusText.style.color = '#00e676';
        } 
        else if (currentState === 'GROUNDED' || currentState === 'AIRBORNE') {
          
          if (groundBaselineY) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, groundBaselineY * canvasElement.height);
            canvasCtx.lineTo(canvasElement.width, groundBaselineY * canvasElement.height);
            canvasCtx.strokeStyle = 'yellow';
            canvasCtx.lineWidth = 2;
            canvasCtx.stroke();
          }

          const isAirborne = currentFootY < (groundBaselineY - jumpThreshold);

          if (currentState === 'GROUNDED' && isAirborne) {
            currentState = 'AIRBORNE';
            takeoffTime = performance.now();
            statusText.innerText = '跳躍中...';
            statusText.style.color = '#ff1744';
          } 
          else if (currentState === 'AIRBORNE' && !isAirborne) {
            const landingTime = performance.now();
            const flightTimeSec = (landingTime - takeoffTime) / 1000;
            
            if (flightTimeSec > 0.15) {
              const heightCm = (1 / 8) * GRAVITY * Math.pow(flightTimeSec, 2) * 100;
              flightTimeText.innerText = flightTimeSec.toFixed(3);
              jumpHeightText.innerText = heightCm.toFixed(1);
            }
            
            currentState = 'GROUNDED';
            statusText.innerText = '偵測中，請起跳！';
            statusText.style.color = '#00e676';
          }
        }
      }
      canvasCtx.restore();
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({image: videoElement});
      },
      width: 640,
      height: 480,
      frameRate: { ideal: 60, max: 120 } 
    });
    camera.start();
  </script>
</body>
</html>
