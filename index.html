<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>垂直跳高度測量 (倒數與紀錄版)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { margin-top: 20px; }
    
    .container {
      position: relative;
      width: 640px;
      height: 480px;
      margin-top: 10px;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }
    
    /* 畫面中央的倒數計時大字 */
    #countdown_overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 150px;
      font-weight: bold;
      color: white;
      text-shadow: 0px 0px 20px #ff3d00;
      display: none;
      z-index: 10;
    }

    .panel {
      width: 640px;
      background: #1e1e1e;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }
    
    /* 歷史紀錄專用版面 */
    .history-panel {
      flex-direction: column;
      align-items: flex-start;
      margin-top: 10px;
    }
    .history-panel h3 {
      margin: 0 0 10px 0;
      color: #00b0ff;
    }
    #history_list {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
    }
    #history_list li {
      background: #2a2a2a;
      margin-bottom: 5px;
      padding: 10px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      border-left: 4px solid #00e676;
    }

    .data-box { text-align: center; }
    .data-value {
      font-size: 24px;
      font-weight: bold;
      color: #00e676;
    }
    .history-value { color: #00e676; font-weight: bold; }
    
    button {
      background-color: #2979ff;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:disabled { background-color: #555; cursor: not-allowed; }
    .btn-ready { background-color: #ff3d00; font-weight: bold; }
    .btn-ready:hover { background-color: #dd3600; }
    
    .status { font-weight: bold; color: #ff9100; }
  </style>
</head>
<body>

  <h2>垂直跳高度即時測量系統</h2>
  
  <div class="container">
    <video id="input_video" width="640" height="480" autoplay playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
    <!-- 倒數計時顯示區塊 -->
    <div id="countdown_overlay">3</div>
  </div>

  <div class="panel">
    <div>
      狀態: <br><span id="status_text" class="status">請按下開始測量</span>
    </div>
    <div class="data-box">
      本次滯空<br>
      <span id="flight_time" class="data-value">0.000</span> 秒
    </div>
    <div class="data-box">
      本次高度<br>
      <span id="jump_height" class="data-value">0.0</span> cm
    </div>
    <button id="start_btn" class="btn-ready">開始測量</button>
  </div>

  <!-- 新增：歷史紀錄版面 -->
  <div class="panel history-panel">
    <h3>測量紀錄</h3>
    <ul id="history_list">
      <!-- 紀錄會自動安插在這裡 -->
    </ul>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const statusText = document.getElementById('status_text');
    const flightTimeText = document.getElementById('flight_time');
    const jumpHeightText = document.getElementById('jump_height');
    const startBtn = document.getElementById('start_btn');
    const countdownOverlay = document.getElementById('countdown_overlay');
    const historyList = document.getElementById('history_list');

    let groundBaselineY = null;
    let jumpThreshold = 0.03;
    let currentState = 'IDLE'; 
    let takeoffTime = 0;
    let jumpCount = 0; // 紀錄跳躍次數
    const GRAVITY = 9.81;

    // 按下開始按鈕：啟動 3 秒倒數
    startBtn.addEventListener('click', () => {
      if (currentState !== 'IDLE') return;
      
      currentState = 'COUNTDOWN';
      startBtn.disabled = true; 
      startBtn.innerText = '準備中...';
      startBtn.classList.remove('btn-ready');
      
      statusText.innerText = '請在原地準備起跳';
      statusText.style.color = '#ff9100';
      
      let count = 3;
      countdownOverlay.innerText = count;
      countdownOverlay.style.display = 'block';

      // 倒數計時器
      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownOverlay.innerText = count;
        } else {
          clearInterval(timer);
          countdownOverlay.style.display = 'none'; // 隱藏倒數
          
          // 倒數結束，切換為抓取基準線狀態
          groundBaselineY = null;
          currentState = 'CALIBRATING';
          startBtn.innerText = '偵測中...';
        }
      }, 1000);
    });

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    pose.onResults((results) => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      
      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 1, radius: 2});

        const leftAnkleY = results.poseLandmarks[27].y;
        const rightAnkleY = results.poseLandmarks[28].y;
        const currentFootY = Math.max(leftAnkleY, rightAnkleY);

        if (currentState === 'IDLE' || currentState === 'COUNTDOWN') {
          canvasCtx.restore();
          return;
        }

        if (currentState === 'CALIBRATING') {
          groundBaselineY = currentFootY;
          currentState = 'GROUNDED';
          statusText.innerText = '請起跳！';
          statusText.style.color = '#00e676';
        } 
        else if (currentState === 'GROUNDED' || currentState === 'AIRBORNE') {
          
          if (groundBaselineY) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, groundBaselineY * canvasElement.height);
            canvasCtx.lineTo(canvasElement.width, groundBaselineY * canvasElement.height);
            canvasCtx.strokeStyle = 'yellow';
            canvasCtx.lineWidth = 2;
            canvasCtx.stroke();
          }

          const isAirborne = currentFootY < (groundBaselineY - jumpThreshold);

          if (currentState === 'GROUNDED' && isAirborne) {
            currentState = 'AIRBORNE';
            takeoffTime = performance.now();
            statusText.innerText = '跳躍中...';
            statusText.style.color = '#ff1744';
          } 
          else if (currentState === 'AIRBORNE' && !isAirborne) {
            const landingTime = performance.now();
            const flightTimeSec = (landingTime - takeoffTime) / 1000;
            
            // 排除過短的雜訊 (小於 0.15 秒)
            if (flightTimeSec > 0.15) {
              const heightCm = (1 / 8) * GRAVITY * Math.pow(flightTimeSec, 2) * 100;
              
              // 1. 更新主畫面數據
              flightTimeText.innerText = flightTimeSec.toFixed(3);
              jumpHeightText.innerText = heightCm.toFixed(1);
              
              // 2. 寫入歷史紀錄面版
              jumpCount++;
              const li = document.createElement('li');
              li.innerHTML = `<span>第 ${jumpCount} 跳</span> <span>滯空 <span class="history-value">${flightTimeSec.toFixed(3)}</span> 秒 / 高度 <span class="history-value">${heightCm.toFixed(1)}</span> cm</span>`;
              // 將最新紀錄安插在清單的最上面
              historyList.insertBefore(li, historyList.firstChild);
            }
            
            // 3. 測量完成，自動停止並回到待機狀態
            currentState = 'IDLE';
            statusText.innerText = '測量完成！請重新按下開始';
            statusText.style.color = '#00b0ff';
            
            // 恢復按鈕狀態，允許下一次測量
            startBtn.innerText = '開始下一次測量';
            startBtn.disabled = false;
            startBtn.classList.add('btn-ready');
          }
        }
      }
      canvasCtx.restore();
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({image: videoElement});
      },
      width: 640,
      height: 480,
      frameRate: { ideal: 60, max: 120 } 
    });
    camera.start();
  </script>
</body>
</html>
