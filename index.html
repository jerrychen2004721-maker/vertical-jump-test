<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>高階垂直跳分析 (CMJ / SJ / DJ)</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212; color: #ffffff; 
      margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }
    
    h2 { margin-top: 10px; margin-bottom: 5px; text-align: center; font-size: 20px; color: #fff;}
    
    /* 模式切換 Tabs */
    .mode-tabs {
      display: flex; width: 100%; max-width: 640px; margin-top: 5px; margin-bottom: 5px;
      background: #1e1e1e; border-radius: 8px; overflow: hidden;
    }
    .mode-tab {
      flex: 1; padding: 12px 5px; text-align: center; background: transparent;
      color: #777; font-weight: bold; border: none; cursor: pointer; transition: 0.2s;
      border-bottom: 3px solid transparent; font-size: 15px;
    }
    .mode-tab.active { color: #00b0ff; border-bottom: 3px solid #00b0ff; background: #2a2a2a; }

    .container {
      position: relative; width: 100%; max-width: 640px; aspect-ratio: 4 / 3; 
      border: 2px solid #333; border-radius: 8px; overflow: hidden; background-color: #000;
    }
    .hidden-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    
    #countdown_overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 120px; font-weight: bold; color: white; text-shadow: 0px 0px 20px #ff3d00; display: none; z-index: 10;
    }

    .panel, .phase-panel {
      width: 100%; max-width: 640px; background: #1e1e1e; padding: 12px; margin-top: 8px;
      border-radius: 8px; display: flex; flex-direction: column; align-items: center; 
    }
    .phase-panel { background: #2a2a2a; gap: 8px; font-size: 14px; }
    .phase-active { color: #ff9100; font-weight: bold; font-size: 16px; }

    .scale-box {
      width: 100%; display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
      margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #444; font-size: 14px;
    }
    .scale-box input { width: 55px; margin: 0 5px; text-align: center; border-radius: 4px; border: none; padding: 4px; font-weight:bold; }

    .data-row { display: flex; width: 100%; justify-content: space-around; margin-bottom: 15px; }
    .data-box { text-align: center; flex: 1; }
    .data-label { font-size: 13px; color: #bbb; }
    .data-value { font-size: 20px; font-weight: bold; color: #00e676; display: block; margin-top: 3px;}
    
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
    button {
      background-color: #2979ff; color: white; border: none; padding: 12px 8px; font-size: 14px; border-radius: 5px;
      cursor: pointer; transition: 0.2s; font-weight: bold; flex: 1 1 calc(50% - 8px); min-width: 120px;
    }
    button:disabled { background-color: #555; cursor: not-allowed; }
    .btn-ready { background-color: #ff3d00; flex: 1 1 100%; font-size: 18px; padding: 15px 10px; }
    .btn-ready:hover { background-color: #dd3600; }
    .btn-upload { background-color: #9c27b0; }
    .btn-cam { background-color: #009688; display: none; }
    .btn-flip { background-color: #f39c12; }
    
    .history-panel { align-items: flex-start; }
    .history-panel h3 { margin: 0 0 10px 0; color: #00b0ff; width: 100%; font-size: 16px;}
    
    #history_list { list-style: none; padding: 0; margin: 0; width: 100%; max-height: 250px; overflow-y: auto;}
    #history_list li {
      background: #2a2a2a; margin-bottom: 8px; padding: 10px; border-radius: 5px;
      display: flex; flex-direction: column; border-left: 4px solid #00e676;
    }
    .record-header { display: flex; justify-content: space-between; align-items: center; font-size: 15px; margin-bottom: 5px; flex-wrap: wrap; gap: 5px;}
    .record-details { font-size: 13px; color: #aaa; line-height: 1.5;}
    .history-value { color: #00e676; font-weight: bold; }
    .cheat-warning { background: #ff1744; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 5px; font-weight: bold; }
    
    .btn-line { background-color: #06C755; color: white; padding: 6px 12px; font-size: 13px; border-radius: 4px; text-decoration: none; display: inline-block; font-weight: bold; margin-top: 6px; align-self: flex-start; }
  </style>
</head>
<body>

  <h2>高階垂直跳動力鏈分析系統</h2>

  <!-- 測試模式選擇 -->
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="CMJ">CMJ<br><span style="font-size:12px;font-weight:normal;">反向跳</span></button>
    <button class="mode-tab" data-mode="SJ">SJ<br><span style="font-size:12px;font-weight:normal;">蹲踞跳</span></button>
    <button class="mode-tab" data-mode="DJ">DJ<br><span style="font-size:12px;font-weight:normal;">落下跳</span></button>
  </div>
  
  <div class="container">
    <video id="webcam_video" class="hidden-video" playsinline autoplay></video>
    <video id="upload_video" class="hidden-video" playsinline muted></video>
    <canvas id="output_canvas"></canvas>
    <div id="countdown_overlay">3</div>
  </div>

  <div class="phase-panel">
    <div>即時屈曲 ➔ 髖: <span id="hip_angle" style="color:#00b0ff;">0°</span> | 膝: <span id="knee_angle" style="color:#00b0ff;">0°</span></div>
    <div>動態階段 ➔ <span id="action_phase" class="phase-active">啟動中...</span></div>
  </div>

  <div class="panel">
    <div class="scale-box">
      <span style="color: #ff9100; font-weight: bold; margin-right: 5px;">📏 比例尺</span>
      身高: <input type="number" id="user_height" value="170"> cm
    </div>

    <div class="data-row">
      <div class="data-box" id="box_1"><span class="data-label" id="label_1">滯空時間</span><span id="val_1" class="data-value">0.000 s</span></div>
      <div class="data-box" id="box_2"><span class="data-label" id="label_2">預估高度</span><span id="val_2" class="data-value">0.0 cm</span></div>
      <div class="data-box" id="box_3" style="display:none;"><span class="data-label" id="label_3">RSI 指數</span><span id="val_3" class="data-value">0.00</span></div>
    </div>
    
    <div class="btn-group">
      <input type="file" id="file_input" accept="video/*" style="display: none;">
      <button id="flip_cam_btn" class="btn-flip">切換鏡頭</button>
      <button id="cam_btn" class="btn-cam">返回相機</button>
      <button id="upload_btn" class="btn-upload">匯入影片</button>
      <button id="start_btn" class="btn-ready">開始 CMJ 測量</button>
    </div>
  </div>

  <div class="panel history-panel">
    <h3>詳細測量紀錄</h3>
    <ul id="history_list"></ul>
  </div>

  <script>
    const webcamVideo = document.getElementById('webcam_video');
    const uploadVideo = document.getElementById('upload_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const startBtn = document.getElementById('start_btn');
    const uploadBtn = document.getElementById('upload_btn');
    const camBtn = document.getElementById('cam_btn');
    const flipCamBtn = document.getElementById('flip_cam_btn');
    const fileInput = document.getElementById('file_input');
    const countdownOverlay = document.getElementById('countdown_overlay');
    const userHeightInput = document.getElementById('user_height');
    
    const hipAngleText = document.getElementById('hip_angle');
    const kneeAngleText = document.getElementById('knee_angle');
    const actionPhaseText = document.getElementById('action_phase');
    const historyList = document.getElementById('history_list');
    
    let isLiveMode = true; 
    let currentFacingMode = 'user'; 
    let currentStream = null; 
    
    let currentState = 'IDLE'; 
    let jumpMode = 'CMJ'; // CMJ, SJ, DJ
    let jumpCount = 0;
    const GRAVITY = 9.81;

    // 核心追蹤變數
    let prevFootY = 0;
    let groundBaselineY = null;
    let boxBaselineY = null;
    
    let takeoffTimestamp = 0;
    let landingStartTimestamp = 0;
    let contactStartTime = 0; // DJ 專用

    let cmPerNormY = 0;       
    let standingHipY = 0;     
    let peakHipY = 1;         

    let tempFlightTime = 0;
    let tempJumpHeight = 0;
    let tempContactTime = 0; // DJ 專用
    let tempRSI = 0;         // DJ 專用

    // 角度與作弊變數
    let takeoffMaxHipFlexion = 0;
    let takeoffMaxKneeFlexion = 0;
    let landingMaxHipFlexion = 0;
    let landingMaxKneeFlexion = 0;
    let sjCounterMovement = false; // SJ 專用
    let jumpThreshold = 0.03;

    const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

    // UI 切換邏輯
    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        if (currentState !== 'IDLE') return;
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        jumpMode = tab.dataset.mode;
        
        startBtn.innerText = `開始 ${jumpMode} 測量`;
        if(jumpMode === 'DJ') {
          document.getElementById('label_1').innerText = '觸地時間(GCT)';
          document.getElementById('box_3').style.display = 'block';
        } else {
          document.getElementById('label_1').innerText = '滯空時間';
          document.getElementById('box_3').style.display = 'none';
        }
        
        document.getElementById('val_1').innerText = (jumpMode === 'DJ' ? '0.000 s' : '0.000 s');
        document.getElementById('val_2').innerText = '0.0 cm';
        document.getElementById('val_3').innerText = '0.00';
      });
    });

    function calculateInnerAngle(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs((radians * 180.0) / Math.PI);
      return angle > 180.0 ? 360.0 - angle : angle;
    }
    function getFlexionAngle(a, b, c) { return 180.0 - calculateInnerAngle(a, b, c); }

    function drawBodyOnly(ctx, landmarks) {
      ctx.lineWidth = 3; ctx.strokeStyle = '#00FF00';
      for (const connection of POSE_CONNECTIONS) {
        if (connection[0] > 10 && connection[1] > 10) {
          const start = landmarks[connection[0]]; const end = landmarks[connection[1]];
          ctx.beginPath(); ctx.moveTo(start.x * canvasElement.width, start.y * canvasElement.height);
          ctx.lineTo(end.x * canvasElement.width, end.y * canvasElement.height); ctx.stroke();
        }
      }
      ctx.fillStyle = '#FF0000';
      for (let i = 11; i < landmarks.length; i++) {
        const lm = landmarks[i];
        ctx.beginPath(); ctx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, 4, 0, 2 * Math.PI); ctx.fill();
      }
    }

    // 產生紀錄與 LINE 分享文字
    function generateRecord() {
      let warningTag = '';
      let shareText = '';
      let detailHTML = '';
      let titleTag = `[${jumpMode}] `;

      // 共用的防屈膝作弊驗證 (僅在有站立校正的 CMJ/SJ 適用)
      let trueHipHeightCm = 0;
      if (jumpMode !== 'DJ') {
        const hipDisplacementNorm = standingHipY - peakHipY;
        trueHipHeightCm = Math.max(0, hipDisplacementNorm * cmPerNormY);
        if ((tempJumpHeight - trueHipHeightCm) > 12) {
          warningTag += `<span class="cheat-warning">⚠️ 屈膝高估 (真:${trueHipHeightCm.toFixed(1)}cm)</span>`;
        }
      }

      if (jumpMode === 'CMJ') {
        shareText = `【${titleTag}動力鏈分析】\n🚀 高度：${tempJumpHeight.toFixed(1)}cm\n⏱️ 滯空：${tempFlightTime.toFixed(3)}s\n📉 推蹬最大屈曲 ➔ 髖:${takeoffMaxHipFlexion.toFixed(0)}°/膝:${takeoffMaxKneeFlexion.toFixed(0)}°\n📉 落地緩衝屈曲 ➔ 髖:${landingMaxHipFlexion.toFixed(0)}°/膝:${landingMaxKneeFlexion.toFixed(0)}°`;
        detailHTML = `滯空: ${tempFlightTime.toFixed(3)}s | 髖部位移估算: ${trueHipHeightCm.toFixed(1)}cm<br>推蹬最大屈曲 ➔ 髖: <span class="history-value">${takeoffMaxHipFlexion.toFixed(0)}°</span> | 膝: <span class="history-value">${takeoffMaxKneeFlexion.toFixed(0)}°</span><br>落地緩衝屈曲 ➔ 髖: <span class="history-value">${landingMaxHipFlexion.toFixed(0)}°</span> | 膝: <span class="history-value">${landingMaxKneeFlexion.toFixed(0)}°</span>`;
      } 
      else if (jumpMode === 'SJ') {
        if (sjCounterMovement) warningTag += `<span class="cheat-warning">⚠️ 下蹲借力作弊</span>`;
        shareText = `【${titleTag}動力鏈分析】\n🚀 高度：${tempJumpHeight.toFixed(1)}cm\n⏱️ 滯空：${tempFlightTime.toFixed(3)}s\n🦵 初始靜止屈曲 ➔ 髖:${takeoffMaxHipFlexion.toFixed(0)}°/膝:${takeoffMaxKneeFlexion.toFixed(0)}°`;
        detailHTML = `滯空: ${tempFlightTime.toFixed(3)}s<br>起跳前初始屈曲 ➔ 髖: <span class="history-value">${takeoffMaxHipFlexion.toFixed(0)}°</span> | 膝: <span class="history-value">${takeoffMaxKneeFlexion.toFixed(0)}°</span><br>落地緩衝屈曲 ➔ 髖: <span class="history-value">${landingMaxHipFlexion.toFixed(0)}°</span> | 膝: <span class="history-value">${landingMaxKneeFlexion.toFixed(0)}°</span>`;
      } 
      else if (jumpMode === 'DJ') {
        shareText = `【${titleTag}反應肌力分析】\n🚀 彈跳高度：${tempJumpHeight.toFixed(1)}cm\n⚡ 觸地時間(GCT)：${tempContactTime.toFixed(3)}s\n🔥 RSI 指數：${tempRSI.toFixed(2)}\n📉 觸地最深屈曲 ➔ 膝:${takeoffMaxKneeFlexion.toFixed(0)}°`;
        detailHTML = `觸地(GCT): ${tempContactTime.toFixed(3)}s | 滯空: ${tempFlightTime.toFixed(3)}s<br>觸地緩衝最深屈曲 ➔ 髖: <span class="history-value">${takeoffMaxHipFlexion.toFixed(0)}°</span> | 膝: <span class="history-value">${takeoffMaxKneeFlexion.toFixed(0)}°</span><br>落地緩衝屈曲 ➔ 髖: <span class="history-value">${landingMaxHipFlexion.toFixed(0)}°</span> | 膝: <span class="history-value">${landingMaxKneeFlexion.toFixed(0)}°</span>`;
      }

      const li = document.createElement('li');
      li.innerHTML = `
        <div class="record-header"><span>第 ${++jumpCount} 跳 <b>[${jumpMode}]</b></span> <span style="color:#00e676; font-weight:bold;">${tempJumpHeight.toFixed(1)} cm ${warningTag}</span></div>
        <div class="record-details">${detailHTML}</div>
        <a href="https://line.me/R/msg/text/?${encodeURIComponent(shareText)}" target="_blank" class="btn-line">分享至 LINE</a>
      `;
      historyList.insertBefore(li, historyList.firstChild);
    }

    // 姿勢分析大腦
    pose.onResults((results) => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      
      if (results.poseLandmarks) {
        drawBodyOnly(canvasCtx, results.poseLandmarks);
        const lms = results.poseLandmarks;
        const currentFootY = Math.max(lms[27].y, lms[28].y, lms[31].y, lms[32].y);
        const currentHipY = (lms[23].y + lms[24].y) / 2;
        
        const avgHipFlexion = (getFlexionAngle(lms[11], lms[23], lms[25]) + getFlexionAngle(lms[12], lms[24], lms[26])) / 2;
        const avgKneeFlexion = (getFlexionAngle(lms[23], lms[25], lms[27]) + getFlexionAngle(lms[24], lms[26], lms[28])) / 2;
        
        hipAngleText.innerText = avgHipFlexion.toFixed(0) + '°';
        kneeAngleText.innerText = avgKneeFlexion.toFixed(0) + '°';

        if (currentState === 'IDLE' || currentState === 'COUNTDOWN') { 
          prevFootY = currentFootY; 
          canvasCtx.restore(); return; 
        }

        const nowSec = isLiveMode ? (performance.now() / 1000) : uploadVideo.currentTime;

        // ==========================================
        // 模式分支邏輯：CMJ / SJ / DJ
        // ==========================================
        
        if (currentState === 'CALIBRATING') {
          if (jumpMode === 'CMJ' || jumpMode === 'SJ') {
            groundBaselineY = currentFootY; 
            cmPerNormY = (parseFloat(userHeightInput.value) || 170) / (currentFootY - lms[0].y);
            standingHipY = currentHipY; peakHipY = currentHipY;
            
            takeoffMaxHipFlexion = avgHipFlexion; 
            takeoffMaxKneeFlexion = avgKneeFlexion;
            sjCounterMovement = false;
            
            currentState = 'GROUNDED'; 
            actionPhaseText.innerText = jumpMode === 'SJ' ? '請維持深蹲並直接起跳!' : '推蹬準備中...';
          } 
          else if (jumpMode === 'DJ') {
            boxBaselineY = currentFootY; // 記錄箱子高度
            currentState = 'ON_BOX';
            actionPhaseText.innerText = '請從跳箱落下';
          }
        } 
        
        // --- DJ 專屬前置階段 ---
        else if (currentState === 'ON_BOX') {
          if (currentFootY > boxBaselineY + 0.05) { // 往下掉落 (Y值變大)
            currentState = 'DROPPING';
            actionPhaseText.innerText = '落下中...';
          }
        }
        else if (currentState === 'DROPPING') {
          // 偵測觸地：當腳不再往下掉(速度接近0)
          if (currentFootY <= prevFootY + 0.002) {
            currentState = 'CONTACT';
            groundBaselineY = currentFootY; 
            contactStartTime = nowSec;
            actionPhaseText.innerText = '觸地緩衝與推蹬!';
          }
        }
        
        // --- 共通觸地階段 (CMJ/SJ = 準備起跳, DJ = 觸地反彈) ---
        else if (currentState === 'GROUNDED' || currentState === 'CONTACT') {
           
           if (groundBaselineY) {
             canvasCtx.beginPath(); canvasCtx.moveTo(0, groundBaselineY * canvasElement.height);
             canvasCtx.lineTo(canvasElement.width, groundBaselineY * canvasElement.height);
             canvasCtx.strokeStyle = 'yellow'; canvasCtx.lineWidth = 2; canvasCtx.stroke();
           }

           // 追蹤最大屈曲
           if (avgHipFlexion > takeoffMaxHipFlexion) takeoffMaxHipFlexion = avgHipFlexion;
           if (avgKneeFlexion > takeoffMaxKneeFlexion) takeoffMaxKneeFlexion = avgKneeFlexion;

           // SJ 防作弊邏輯
           if (jumpMode === 'SJ' && avgKneeFlexion > takeoffMaxKneeFlexion + 5) {
              sjCounterMovement = true; 
           }

           const isAirborne = currentFootY < (groundBaselineY - jumpThreshold);

           if (isAirborne) {
              currentState = 'AIRBORNE';
              takeoffTimestamp = nowSec;
              
              if (jumpMode === 'DJ') {
                tempContactTime = Math.max(0, takeoffTimestamp - contactStartTime);
                document.getElementById('val_1').innerText = tempContactTime.toFixed(3) + ' s';
              }
              
              actionPhaseText.innerText = '滯空 (Flight)';
              landingMaxHipFlexion = 0; landingMaxKneeFlexion = 0; peakHipY = currentHipY;
           }
        }
        
        // --- 空中階段 ---
        else if (currentState === 'AIRBORNE') {
          if (currentHipY < peakHipY) { peakHipY = currentHipY; }
          const isAirborne = currentFootY < (groundBaselineY - jumpThreshold);
          
          if (!isAirborne) { // 落地
            const flightTimeSec = Math.max(0, nowSec - takeoffTimestamp);
            
            if (flightTimeSec > 0.15) {
              tempFlightTime = flightTimeSec;
              tempJumpHeight = (1 / 8) * GRAVITY * Math.pow(flightTimeSec, 2) * 100;
              
              if (jumpMode === 'DJ') {
                tempRSI = tempJumpHeight / (tempContactTime * 100); // 另一種常見的 RSI 為 滯空/觸地，這裡採高度/觸地
                document.getElementById('val_2').innerText = tempJumpHeight.toFixed(1) + ' cm';
                document.getElementById('val_3').innerText = tempRSI.toFixed(2);
              } else {
                document.getElementById('val_1').innerText = tempFlightTime.toFixed(3) + ' s';
                document.getElementById('val_2').innerText = tempJumpHeight.toFixed(1) + ' cm';
              }
              
              currentState = 'LANDING';
              landingStartTimestamp = nowSec;
              actionPhaseText.innerText = '落地緩衝中...';
            } else {
              currentState = 'IDLE'; actionPhaseText.innerText = '測量失敗 (滯空過短)';
              resetButtons();
            }
          }
        }
        
        // --- 落地緩衝階段 ---
        else if (currentState === 'LANDING') {
           if (avgHipFlexion > landingMaxHipFlexion) landingMaxHipFlexion = avgHipFlexion;
           if (avgKneeFlexion > landingMaxKneeFlexion) landingMaxKneeFlexion = avgKneeFlexion;
           
           if (nowSec - landingStartTimestamp > 1.0 || (!isLiveMode && uploadVideo.ended)) {
              generateRecord();
              currentState = 'IDLE'; actionPhaseText.innerText = '測量完成！';
              if (!isLiveMode) { uploadVideo.pause(); }
              resetButtons();
           }
        }
        
        prevFootY = currentFootY;
      }
      canvasCtx.restore();
    });

    function resetButtons() {
      startBtn.innerText = isLiveMode ? `開始 ${jumpMode} 測量` : '重新分析影片';
      startBtn.disabled = false; startBtn.classList.add('btn-ready');
    }

    async function startWebcam() {
      isLiveMode = true; camBtn.style.display = 'none'; flipCamBtn.style.display = 'block'; 
      canvasElement.style.transform = currentFacingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
      actionPhaseText.innerText = `相機啟動中...`; startBtn.disabled = true;
      if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); webcamVideo.srcObject = null; }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }
        });
        webcamVideo.srcObject = currentStream; await webcamVideo.play();
        actionPhaseText.innerText = `待機中`; resetButtons(); processWebcamFrame(); 
      } catch (err) { actionPhaseText.innerText = '無法啟動相機'; }
    }
    
    function processWebcamFrame() {
      if (!isLiveMode || webcamVideo.paused || webcamVideo.ended) return;
      pose.send({image: webcamVideo}).then(() => requestAnimationFrame(processWebcamFrame)).catch(() => requestAnimationFrame(processWebcamFrame));
    }

    startWebcam();
    flipCamBtn.addEventListener('click', () => { currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user'; startWebcam(); });
    camBtn.addEventListener('click', () => { uploadVideo.pause(); currentState = 'IDLE'; startWebcam(); });
    
    uploadBtn.addEventListener('click', () => { fileInput.click(); });
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0]; if (!file) return;
      isLiveMode = false;
      if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); webcamVideo.srcObject = null; }
      canvasElement.style.transform = 'scaleX(1)';
      camBtn.style.display = 'block'; flipCamBtn.style.display = 'none'; 
      actionPhaseText.innerText = '處理影片中...'; startBtn.disabled = true;
      uploadVideo.src = URL.createObjectURL(file); uploadVideo.load();
    });

    uploadVideo.addEventListener('loadeddata', () => {
      uploadVideo.currentTime = 0;
      setTimeout(async () => {
        try {
          await pose.send({image: uploadVideo}); currentState = 'IDLE';
          let hintText = jumpMode === 'DJ' ? '請確保站立於跳箱上入鏡' : '請確保全身站直入鏡';
          actionPhaseText.innerText = `影片已就緒 (${hintText})`;
          resetButtons();
        } catch(err) {}
      }, 500); 
    });

    function processUploadFrame() {
      if (isLiveMode || uploadVideo.paused || uploadVideo.ended) return;
      pose.send({image: uploadVideo}).then(() => requestAnimationFrame(processUploadFrame)).catch(() => requestAnimationFrame(processUploadFrame));
    }
    uploadVideo.addEventListener('play', processUploadFrame);

    startBtn.addEventListener('click', () => {
      if (currentState !== 'IDLE') return;
      if (isLiveMode) {
        currentState = 'COUNTDOWN'; startBtn.disabled = true; startBtn.innerText = '準備中...'; startBtn.classList.remove('btn-ready');
        let count = 3; countdownOverlay.innerText = count; countdownOverlay.style.display = 'block';
        const timer = setInterval(() => {
          count--;
          if (count > 0) { countdownOverlay.innerText = count; } 
          else {
            clearInterval(timer); countdownOverlay.style.display = 'none';
            groundBaselineY = null; boxBaselineY = null; currentState = 'CALIBRATING'; startBtn.innerText = '測量中...';
          }
        }, 1000);
      } else {
        groundBaselineY = null; boxBaselineY = null; currentState = 'CALIBRATING';
        startBtn.disabled = true; startBtn.innerText = '分析中...'; startBtn.classList.remove('btn-ready');
        uploadVideo.currentTime = 0; uploadVideo.play(); 
      }
    });
  </script>
</body>
</html>
